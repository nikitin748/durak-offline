name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Rules engine tests
        run: ./gradlew :engine:test --no-daemon
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Save build log to ci-logs branch
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          mkdir /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || true
          git checkout --orphan ci-logs && git rm -rf . -q && cp /tmp/logs/* . 2>/dev/null || true
          git add build.log 2>/dev/null || true
          git commit -m "build log" --allow-empty -q && git push -f origin ci-logs
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk durak-offline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: durak-offline-apk
          path: durak-offline.apk
      - name: Publish as the "latest" release (stable download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest durak-offline.apk --title "Дурак офлайн (последняя сборка)" \
            --notes "Скачай durak-offline.apk на телефон и установи (разреши установку из неизвестных источников)." --latest
